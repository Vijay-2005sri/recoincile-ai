<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./scene.css">
  </head>
  <body>
    <section id="scene-root" aria-label="Three-dimensional reconciliation flow">
      <header class="scene-header">
        <div>
          <h2>Reconciliation flow</h2>
          <p>Curved tubes and moving particles show live source-to-verification volume.</p>
        </div>
        <span id="scene-state" class="scene-state">LIVE DATA FLOW</span>
      </header>
      <div id="scene-view">
        <div id="scene-loading" class="scene-loading">Loading 3D reconciliation flow…</div>
        <div class="scene-caption">Tube width represents record volume. Arrowheads show direction.</div>
      </div>
    </section>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
